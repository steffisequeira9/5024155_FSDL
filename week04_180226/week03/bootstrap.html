<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bootstrap Demo - Steffi</title>

    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<!-- ================= NAVBAR ================= -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="#">Steffi Project</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="#">About</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Services</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- ================= JUMBOTRON (Hero Section) ================= -->
<div class="bg-primary text-white text-center p-5 mb-4">
    <div class="container">
        <h1 class="display-4">Welcome to Bootstrap Demo</h1>
        <p class="lead">This page demonstrates Grid, Navbar, Form, Buttons & More</p>
        <button class="btn btn-light btn-lg">Learn More</button>
    </div>
</div>

<div class="container">

<!-- ================= BREADCRUMB ================= -->
<nav aria-label="breadcrumb">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="#">Home</a></li>
    <li class="breadcrumb-item"><a href="#">Library</a></li>
    <li class="breadcrumb-item active">Data</li>
  </ol>
</nav>

<!-- ================= GRID SYSTEM ================= -->
<div class="row text-center mt-4">
    <div class="col-md-4 bg-light p-3 border">
        <h4>Column 1</h4>
        <p>This is grid column 1</p>
        <button class="btn btn-success">Success</button>
    </div>

    <div class="col-md-4 bg-warning p-3 border">
        <h4>Column 2</h4>
        <p>This is grid column 2</p>
        <button class="btn btn-danger">Danger</button>
    </div>

    <div class="col-md-4 bg-info p-3 border">
        <h4>Column 3</h4>
        <p>This is grid column 3</p>
        <button class="btn btn-dark">Dark</button>
    </div>
</div>

<!-- ================= FORM ================= -->
<div class="mt-5">
    <h3>Contact Form</h3>
    <form>
        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" placeholder="Enter your name">
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" placeholder="Enter your email">
        </div>

        <div class="mb-3">
            <label class="form-label">Message</label>
            <textarea class="form-control" rows="3"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Submit</button>
        <button type="reset" class="btn btn-secondary">Reset</button>
    </form>
</div>

</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
