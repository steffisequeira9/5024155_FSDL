<!DOCTYPE html>
<html>
<head>
    <title>Form with Frame</title>

    <!-- INTERNAL CSS -->
    <style>
        body {
            background-color: #dba9cf;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 600px;
            margin: auto;
            background-color: rgb(10, 208, 243);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(149, 126, 177, 0.1);
        }

        h2, h3 {
            text-align: center;
            color: hsl(286, 53%, 52%);
        }

        label {
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
        }

        iframe {
            display: block;
            margin: auto;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <!-- Inline CSS used here -->
    <div class="container" style="margin-top: 40px;">

        <h2>Student Form</h2>

        <form>
            <label>Name:</label><br>
            <input type="text" placeholder="Enter your name"><br><br>

            <label>Email:</label><br>
            <input type="email" placeholder="Enter your email"><br><br>

            <!-- Inline CSS on button -->
            <input type="submit" value="Submit" 
                   style="background-color:#24e4c4; color:rgb(233, 14, 14); padding:8px 20px; border:none; border-radius:5px;">
        </form>

        <hr style="margin: 25px 0;">

        <h3>Learning Video</h3>

        <!-- Frame with YouTube video -->
        <iframe 
            width="100%" 
            height="315" 
            src="https://www.youtube.com/embed/w5w6o2QEDvg"
            title="YouTube video player"
            allowfullscreen>
        </iframe>

    </div>

</body>
</html>
