<!DOCTYPE html>
<html>
<head>
    <title>Resume Screening Demo</title>

    <!-- INTERNAL CSS -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .box {
            width: 300px;
            margin: 100px auto;
            background: white;
            padding: 20px;
            text-align: center;
            border-radius: 6px;
            box-shadow: 0 0 5px gray;
        }

        button {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 8px 15px;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="box">
        <h3>Resume Screening</h3>

        <!-- INLINE CSS -->
        <input type="file" style="margin-bottom:10px;"><br>

        <button>Check Match</button>

        <p style="margin-top:15px;"><b>Score:</b> 75%</p>
    </div>

</body>
</html>
